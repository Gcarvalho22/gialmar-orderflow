<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>Teste Paginacao Contactos</title>
<style>
.page-btn{padding:6px 12px;margin:2px;border:1px solid #ccc;background:#fff;cursor:pointer;border-radius:4px;}
.page-btn.active{background:#1565c0;color:#fff;border-color:#1565c0;}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}
</style>
</head>
<body style="font-family:sans-serif;padding:20px">
<h2>Teste Paginacao</h2>
<div id="status" style="color:green;margin-bottom:10px">A iniciar...</div>
<div id="pagin"></div>
<div id="lista" style="margin-top:10px;border:1px solid #eee;padding:10px;min-height:100px"></div>

<script>
var DB = [];
for(var i=1;i<=56;i++) DB.push({id:i, company:'Empresa '+i, status:'ativo', priority:'A', country:'PT', email:null, phone:null});

var _listPage = 1;
var PAGE_SIZE = 20;
var _paginCbs = {};

function ftBuildPagin(containerId, currentPage, totalPages, onPageClick) {
  var container = document.getElementById(containerId);
  if (!container) return;
  _paginCbs[containerId] = onPageClick;
  container.innerHTML = '';
  if (totalPages <= 1) return;

  function makeBtn(label, page, isActive, isDisabled) {
    var btn = document.createElement('button');
    btn.className = 'page-btn' + (isActive ? ' active' : '');
    btn.textContent = label;
    if (isDisabled) {
      btn.disabled = true;
    } else {
      (function(p) {
        btn.onclick = function() {
          document.getElementById('status').textContent = 'Clicado pagina ' + p;
          if (_paginCbs[containerId]) _paginCbs[containerId](p);
        };
      })(page);
    }
    return btn;
  }

  if (currentPage > 1) container.appendChild(makeBtn('Prev', currentPage-1, false, false));
  for (var p = 1; p <= totalPages; p++) container.appendChild(makeBtn(p, p, p===currentPage, false));
  if (currentPage < totalPages) container.appendChild(makeBtn('Next', currentPage+1, false, false));

  var info = document.createElement('span');
  info.style.cssText = 'font-size:12px;color:#999;margin-left:8px';
  info.textContent = 'Pag. ' + currentPage + '/' + totalPages;
  container.appendChild(info);
}

function renderList() {
  var filtered = DB;
  var total = filtered.length;
  var totalPages = Math.ceil(total/PAGE_SIZE);
  if(_listPage>totalPages) _listPage=Math.max(1,totalPages);
  var start = (_listPage-1)*PAGE_SIZE;
  var paged = filtered.slice(start, start+PAGE_SIZE);
  
  document.getElementById('lista').innerHTML = 
    '<strong>Pagina '+_listPage+' — '+paged.length+' contactos ('+start+' a '+(start+paged.length-1)+')</strong><br>' +
    paged.map(function(c){return c.company;}).join(', ');
  
  ftBuildPagin('pagin', _listPage, totalPages, function(p){ _listPage=p; renderList(); });
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('status').textContent = 'Pronto - '+DB.length+' contactos';
  renderList();
});
</script>
</body>
</html>
